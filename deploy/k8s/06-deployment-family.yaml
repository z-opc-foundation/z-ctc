# ============================================================
# z-ctc 4A 认证中心 (SSO token 签发方)
#
# z-ops admin 的 sso 闸由 z-ctc-sso 模块提供, 但**签发 token 的服务必须单独跑起来**
# —— 只有签发方在, 才有人能登录换到 cookie, 否则 z-ops 的 UI 一步都点不动。
#
# 两边用的是同一个硬编码 HS256 密钥 (z-ctc-sso 的 SsoAutoConfiguration#jwtUtil),
# z-ops 已内嵌同一份 jar, 所以这里**不需要**配任何共享密钥。
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: z-ctc
---
#   kubectl -n z-ctc create secret generic z-ctc-db \
#     --from-literal=db-password='<与 z-ops 同库同密码>'
#
# secretKeyRef 只能读**同 namespace** 的 secret, 所以 z-ctc 虽然连的是同一个
# MySQL, 也必须在自己的 ns 里有一份 z-ctc-db。值必须和 z-ops 的 z-ops-db
# 一致 —— 不同的话 z-ctc 连不上库, 表现是启动后 druid 报 access denied。
apiVersion: v1
kind: Secret
metadata:
  name: z-ctc-db
  namespace: z-ctc
type: Opaque
stringData:
  db-password: "REPLACE_ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: z-ctc-admin
  namespace: z-ctc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: z-ctc-admin
  template:
    metadata:
      labels:
        app: z-ctc-admin
    spec:
      # 镜像只灌进了控制平面的 containerd, worker 上没有
      nodeSelector:
        kubernetes.io/hostname: zifang001
      containers:
        - name: z-ctc
          image: z-ctc-admin:251
          imagePullPolicy: Never
          ports:
            - containerPort: 8888
          env:
            # 与 z-ops 共用同一个 MySQL 实例, 不同库 (z_ops / z_ctc)
            - name: DB_HOST
              value: z-ops-mysql.z-ops.svc.cluster.local
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: z_ctc
            - name: DB_USERNAME
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: z-ctc-db
                  key: db-password
            - name: SSO_ENABLED
              value: "true"
            # z-ops 的闸是 302 跳到 login-url; 指回 z-ops 自己。
            - name: SSO_LOGIN_URL
              value: http://127.0.0.1:30886/
            - name: SSO_COOKIE_DOMAIN
              value: ""
            - name: SSO_COOKIE_SECURE
              value: "false"
          envFrom:
            - configMapRef:
                name: z-ctc-sso-exclude
          volumeMounts:
            - name: tmp
              mountPath: /tmp/ctc-tmp
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: z-ctc-admin
  namespace: z-ctc
spec:
  selector:
    app: z-ctc-admin
  ports:
    - name: http
      port: 8888
      targetPort: 8888
---
# NodePort 直连入口。家庭集群没有 Ingress + 域名证书那套东西,
# 8088 留给 z-ops 的 SSO_LOGIN_URL 指回来用。
apiVersion: v1
kind: Service
metadata:
  name: z-ctc-admin-np
  namespace: z-ctc
spec:
  type: NodePort
  selector:
    app: z-ctc-admin
  ports:
    - name: http
      port: 8888
      targetPort: 8888
      nodePort: 30888