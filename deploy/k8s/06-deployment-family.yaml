# ============================================================
# z-ctc 4A 认证中心 (SSO token 签发方)
#
# z-ops admin 的 sso 闸由 z-ctc-sso 模块提供, 但**签发 token 的服务必须单独跑起来**
# —— 只有签发方在, 才有人能登录换到 cookie, 否则 z-ops 的 UI 一步都点不动。
#
# 两边用的是同一个硬编码 HS256 密钥 (z-ctc-sso 的 SsoAutoConfiguration#jwtUtil),
# z-ops 已内嵌同一份 jar, 所以这里**不需要**配任何共享密钥。
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: z-ctc
---
# 这个文件**不再**定义 z-ctc-db。
#
# 原先这里带了一个 stringData: db-password: REPLACE_ME 的 Secret 定义, 而真正
# 的口令是部署时用 `kubectl create secret` 灌进去的 —— 于是每次 `kubectl apply -f`
# 都会把手工灌的真值覆盖成 REPLACE_ME。2026-10-15 切阿里云 RDS 时真被覆盖了一次
# (当时零消费者,没造成运行影响,但真值不可逆地丢了)。
#
# 现在改法: secret 只用命令创建, 不进清单。
#   PW=$(grep '^Z_BASE_DB_DEFAULT_PASSWORD=' \
#          /Users/zifang/workplace/ceo_workplace/z-opc-foundation/z-opc-foundation-lead/004_重要秘钥/z-opc.env | cut -d= -f2-)
#   kubectl -n z-ctc create secret generic aliyun-db --from-literal=db-password="$PW"
#
# 阿里云 RDS 的 zifang 账号通常只授内网来源 IP, 从集群内直连已实测可行
# (z-ops-mysql 容器里的 mysql 客户端能连上)。
#
# 留这份注释是因为老读者还会去找这个名字: secretKeyRef 只能读**同 namespace**
# 的 secret, 所以 z-ctc 虽然连的是同一个 RDS, 也必须在自己的 ns 里有一份。
# 名字从 z-ctc-db 改成了 aliyun-db —— 它现在连的不是集群内 MySQL 了。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: z-ctc-admin
  namespace: z-ctc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: z-ctc-admin
  template:
    metadata:
      labels:
        app: z-ctc-admin
    spec:
      # 镜像只灌进了控制平面的 containerd, worker 上没有
      nodeSelector:
        kubernetes.io/hostname: zifang001
      containers:
        - name: z-ctc
          image: z-ctc-admin:251
          imagePullPolicy: Never
          ports:
            - containerPort: 8888
          env:
            # 身份库指生产 RDS 的 oc —— 与 z-ops、z-opc 系各仓同库同源。
            # 集群内那个 z_ctc 库是 2026-10-12 部署时顺手建的空壳, 只有 10 个
            # opsdemo/ceo1* 测试账号、**没有 admin**, 导致 ops.zopc.top 登不进去。
            # oc 库里 admin(id=1, tenant=default) 和真实角色授权都在, 且两边
            # 共用同一套 JWT HS256 密钥, 切过去登录态天然互通。
            # 口令真值在 lead/004_重要秘钥/z-opc.env 的 Z_BASE_DB_DEFAULT_PASSWORD,
            # 本仓只放占位符。
            - name: DB_HOST
              value: rm-bp108uqlgwn712k54ho.mysql.rds.aliyuncs.com
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: oc
            - name: DB_USERNAME
              value: zifang
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aliyun-db
                  key: db-password
            - name: SSO_ENABLED
              value: "true"
            # z-ops 的闸是 302 跳到 login-url; 指回 z-ops 自己。
            - name: SSO_LOGIN_URL
              value: http://127.0.0.1:30886/
            - name: SSO_COOKIE_DOMAIN
              value: ""
            - name: SSO_COOKIE_SECURE
              value: "false"
          envFrom:
            - configMapRef:
                name: z-ctc-sso-exclude
          volumeMounts:
            - name: tmp
              mountPath: /tmp/ctc-tmp
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: z-ctc-admin
  namespace: z-ctc
spec:
  selector:
    app: z-ctc-admin
  ports:
    - name: http
      port: 8888
      targetPort: 8888
---
# NodePort 直连入口。家庭集群没有 Ingress + 域名证书那套东西,
# 8088 留给 z-ops 的 SSO_LOGIN_URL 指回来用。
apiVersion: v1
kind: Service
metadata:
  name: z-ctc-admin-np
  namespace: z-ctc
spec:
  type: NodePort
  selector:
    app: z-ctc-admin
  ports:
    - name: http
      port: 8888
      targetPort: 8888
      nodePort: 30888