# ============================================================
# z-ctc 4A 认证中心 (SSO token 签发方)
#
# z-ops admin 的 sso 闸由 z-ctc-sso 模块提供, 但**签发 token 的服务必须单独跑起来**
# —— 只有签发方在, 才有人能登录换到 cookie, 否则 z-ops 的 UI 一步都点不动。
#
# 两边用的是同一个硬编码 HS256 密钥 (z-ctc-sso 的 SsoAutoConfiguration#jwtUtil),
# z-ops 已内嵌同一份 jar, 所以这里**不需要**配任何共享密钥。
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: z-ctc
---
# 这个文件**不再**定义 z-ctc-db。
#
# 原先这里带了一个 stringData: db-password: REPLACE_ME 的 Secret 定义, 而真正
# 的口令是部署时用 `kubectl create secret` 灌进去的 —— 于是每次 `kubectl apply -f`
# 都会把手工灌的真值覆盖成 REPLACE_ME。2026-10-15 切阿里云 RDS 时真被覆盖了一次
# (当时零消费者,没造成运行影响,但真值不可逆地丢了)。
#
# 现在改法: secret 只用命令创建, 不进清单。
#   PW=$(grep '^Z_BASE_DB_DEFAULT_PASSWORD=' \
#          /Users/zifang/workplace/ceo_workplace/z-opc-foundation/z-opc-foundation-lead/004_重要秘钥/z-opc.env | cut -d= -f2-)
#   kubectl -n z-ctc create secret generic aliyun-db \
#     --from-literal=db-password="$PW" \
#     --from-literal=db-host="$RDS_HOST"     # 阿里云 RDS 主机名，也走 secret，仓内不留云端地址
#
# 阿里云 RDS 的 zifang 账号通常只授内网来源 IP, 从集群内直连已实测可行
# (z-ops-mysql 容器里的 mysql 客户端能连上)。
#
# 留这份注释是因为老读者还会去找这个名字: secretKeyRef 只能读**同 namespace**
# 的 secret, 所以 z-ctc 虽然连的是同一个 RDS, 也必须在自己的 ns 里有一份。
# 名字从 z-ctc-db 改成了 aliyun-db —— 它现在连的不是集群内 MySQL 了。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: z-ctc-admin
  namespace: z-ctc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: z-ctc-admin
  template:
    metadata:
      labels:
        app: z-ctc-admin
    spec:
      # 2026-10-25: 集群重建成后只剩单节点 zifang002, 原 zifang001 不存在,
      # 钉它 pod 永远 Pending。镜像直接灌进 zifang002 的 containerd。
      nodeSelector:
        kubernetes.io/hostname: zifang002
      containers:
        - name: z-ctc
          image: z-ctc-admin:1.0.5-zboot112-amd64
          imagePullPolicy: Never
          ports:
            - containerPort: 8888
          env:
            # 身份库指生产 RDS 的 oc —— 与 z-ops、z-opc 系各仓同库同源。
            # 集群内那个 z_ctc 库是 2026-10-12 部署时顺手建的空壳, 只有 10 个
            # opsdemo/ceo1* 测试账号、**没有 admin**, 导致 ops.zopc.top 登不进去。
            # oc 库里 admin(id=1, tenant=default) 和真实角色授权都在, 且两边
            # 共用同一套 JWT HS256 密钥, 切过去登录态天然互通。
            # 口令真值在 lead/004_重要秘钥/z-opc.env 的 Z_BASE_DB_DEFAULT_PASSWORD,
            # 本仓只放占位符。
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: aliyun-db
                  key: db-host
            # 2026-10-25: Dockerfile.backend 的 ENV 钉的是 Mode1 compose 形态
            # (SERVER_PORT=8080, ctx=/ctc), 而 family 形态按 application.yml 跑
            # 8888/ctx=/。镜像重建(Dockerfile 未改)后 env 必须显式压回, 否则
            # Service 8888 打到一个 8080 容器上, 集群内全断。
            - name: SERVER_PORT
              value: "8888"
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: "/"
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: oc
            - name: DB_USERNAME
              value: zifang
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aliyun-db
                  key: db-password
            - name: SSO_ENABLED
              value: "true"
            # 未登录时 SsoInterceptor 发的 302 指向这里。
            #
            # 这里原来配的是 `http://127.0.0.1:30886/`(z-ops 的 NodePort)。服务端自己
            # curl 127.0.0.1 连得到 z-ops, 看着是通的; 但这个 URL 是**发给浏览器**的,
            # 浏览器里的 127.0.0.1 是**终端用户自己的机器** —— 本机没监听就
            # ERR_CONNECTION_REFUSED, 恰好有监听就连到不相干的进程。
            # 2026-10-19 实测: 用户报「打开工作台各种挂」, 根因就是这一条。
            #
            # 注意**不是** ctc.zopc.top —— ctc 自己那个域虽然叫 4A 认证中心, 服务的却是
            # _frontend/z-ctc-suit, 它的登录页 (src/LoginPage.jsx) 是 CTC/SSO 接入前的
            # mock: 只比对硬编码 admin/123456, 往 localStorage 写 `mock-admin`,
            # 从不调 /api/ctc/authn/login, 也拿不到 SSO cookie。送过去登完等于没登。
            # 真正能签发 SSO cookie 的是 opc.zopc.top/login: z-opc 主壳的登录页真调
            # /ctc/authn/login(经 kapi 改写), 且已经实现了读 ?redirect= 回跳
            # (z-opc .../common/components/Ctc/login/index.tsx:54-70)。
            - name: SSO_LOGIN_URL
              value: https://opc.zopc.top/login
            # 留空 = cookie 只发给应答的那个域, 于是 cookie 落在 ctc.zopc.top 上,
            # 兄弟域(oss/opc/ops)拿不到, 回程就断在半路。SSO 权威域下面全是兄弟域,
            # 必须显式给 .zopc.top。仓里此前是空串而线上 pod 是 .zopc.top, 已漂移, 这里对齐。
            - name: SSO_COOKIE_DOMAIN
              value: .zopc.top
            - name: SSO_COOKIE_SECURE
              value: "false"
            # SSO 签名密钥：z-ctc-sso 1.0.5 起该密钥不再内置在 class 常量池里
            # （那一版的明文密钥已随 1.0.4 发到中央、中央坐标不可撤回）⇒ 改为
            # env 注入，缺失即 fail-closed 拒绝启动。值只走 secret 引用，
            # 仓里不出现明文。⚠ 2026-10-23（卡 TASK-20261023-008）补进本清单：
            # 此前 live 已有、清单缺（live 是靠一次 env 补丁派发补上的）。
            - name: SSO_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sso-jwt
                  key: sso-jwt-secret
          envFrom:
            - configMapRef:
                name: z-ctc-sso-exclude
          volumeMounts:
            - name: tmp
              mountPath: /tmp/ctc-tmp
          # 就绪探针：/actuator/health
          # ⚠ 2026-10-23（卡 TASK-20261023-041）显式补 timeoutSeconds。
          #   此前**清单里没写** timeoutSeconds ⇒ 线上取的是 k8s API 的默认值 **1 秒**；
          #   而「JVM 起来后的第一次 HTTP 请求」要背 DispatcherServlet 类加载 + actuator
          #   健康检查首次装配 + 第一条 RDS 连接 ⇒ 实测首次请求 > 1s ⇒ **每次滚动必出一条**
          #   `Readiness probe failed … context deadline exceeded`。
          #   取值 15s 的依据（卡内实测）：
          #     热态 10 次采样 = 9.0~10.2ms（max 0.0102s）⇒ 端点本身不慢；
          #     冷态首次请求实测被 1s 预算砍断 ⇒ > 1s；第二次探测（10s 后）成功
          #     ⇒ 冷态首次请求窗口 ∈ (1s, ~11s] ⇒ 15s 留约 1.4 倍余量。
          #   initialDelaySeconds 保持 45：实测应用本体 T+13.5s 就 Started
          #   （`Started ZCtcAdminApplication in 10.65 seconds`）⇒ 45s 已远大于冷启动，
          #   慢的是「第一次请求」而不是「应用起来」⇒ 延后探测并不能消除首请求冷路径。
          # 2026-10-25: 上面四个字段此前裸挂在 container 层(k8s 严格解码直接拒)，
          #   且整个清单从未有过 readinessProbe 块 —— 本轮重部署时修正成正经探针。
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            timeoutSeconds: 15
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: z-ctc-admin
  namespace: z-ctc
spec:
  selector:
    app: z-ctc-admin
  ports:
    - name: http
      port: 8888
      targetPort: 8888
---
# NodePort 直连入口（30888）。z-ops 的 SSO_LOGIN_URL 不再指这里 —— 那是把服务端能连的
# 地址发给浏览器, 浏览器侧 127.0.0.1 指向用户自己的机器(见上面 SSO_LOGIN_URL 的注释)。
# 留这个 NodePort 只给集群内直连调试用。
apiVersion: v1
kind: Service
metadata:
  name: z-ctc-admin-np
  namespace: z-ctc
spec:
  type: NodePort
  selector:
    app: z-ctc-admin
  ports:
    - name: http
      port: 8888
      targetPort: 8888
      nodePort: 30888